name: Bug report or installation help
description: Report a reproducible failure using synthetic steps and safe version details.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Read the setup and troubleshooting guide first.
        Never attach real mail, addresses, credentials, certificates, attachments,
        credential stores, raw logs, or private screenshots.
        For vulnerabilities, use Security → Report a vulnerability instead.
  - type: input
    id: versions
    attributes:
      label: Versions and architecture
      description: Extension, Windows, Claude Desktop, Node, and x64/ARM64; no machine or account identifiers.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Is Claude's built-in Node runtime disabled?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - GMX
        - Proton Bridge
        - Neither / build or installation
    validations:
      required: true
  - type: input
    id: error
    attributes:
      label: Tool and static error code
      description: For example, list_folders and CONNECTION. Do not paste raw logs.
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Steps, instructions followed, expected behavior, and actual behavior. Use invented data only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real mailbox data, credentials, certificates, or private diagnostics.
          required: true
