name: Windows validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run scan
      - run: npm run package
      - run: npm run smoke:bundle
      # No automatic artifact upload: public binary distribution requires a recorded Claude Desktop installation smoke test.
