name: Windows validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run scan
      - run: npm run package
      - run: npm run smoke:bundle
      # No automatic artifact upload: public binary distribution requires a recorded Claude Desktop installation smoke test.
