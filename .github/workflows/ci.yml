name: Windows validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run scan
      - run: npm run package
      - run: npm run smoke:bundle
      # No automatic artifact upload: public binary distribution requires a recorded Claude Desktop installation smoke test.
